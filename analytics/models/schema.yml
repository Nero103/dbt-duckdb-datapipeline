models:
  - name: job_postings
    description: Cleaned job postings;
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: this is the scraper's posting id, re-scrapped pstings repeat the id
      - name: job_title
        description: posting title as scrapped
      - name: company_name
        description: employer name as scrapped
      - name: job_location
        description: posting location as scrapped
      - name: job_via
        description: posting platform as scrapped (e.g., via LinkedIn)
      - name: job_schedule_type
        description: schedule as posted
      - name: job_work_from_home
        description: true when posting is flagged remote
      - name: search_date
        description: date of scrap
      - name: search_term
        description: role scraper seached for

  - name: jobs_per_month
    description: monthly posting counts by row
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: posting month, truncated by search_date
      - name: role
        description: search role, from search_term
      - name: postings
        description: postings counted for the role that matched

  - name: top_locations
    description: top 10 location by posting count
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: posting location by grain
      - name: postings
        description: postings counted for the location
      