models:
  - name: job_postings
    description: Cleaned job postings;
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: This is the scraper's posting id, re-scrapped pstings repeat the id
      - name: job_title
        description: Posting title as scrapped
        data_tests:
          - not_null
      - name: company_name
        description: Employer name as scrapped
      - name: job_location
        description: Posting location as scrapped
      - name: job_via
        description: Posting platform as scrapped (e.g., via LinkedIn)
      - name: job_schedule_type
        description: Schedule as posted
      - name: job_work_from_home
        description: True when posting is flagged remote
      - name: search_date
        description: Date of scrap
      - name: search_term
        description: Role scraper seached for

  - name: jobs_per_month
    description: Monthly posting counts by row
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Posting month, truncated by search_date
      - name: role
        description: Search role, from search_term
      - name: postings
        description: Postings counted for the role that matched

  - name: top_locations
    description: Top 10 location by posting count
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: Posting location by grain
      - name: postings
        description: Postings counted for the location
  
  - name: monthly_summary
    description: Monthly summary of job postings, one row per month
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Month of summary
        data_tests:
          - unique
          - not_null
      - name: total_postings
        description: All postings that month (summed from jobs_per_month)
      - name: remote_postings
        description: Postings flagged remote that month
      - name: pct_remote
        description: Share of month postings that are remote

  - name: remote_jobs_by_company
    description: Remote job postings by location, one row per month
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: company_name
        description: Company name of job posted
        data_tests:
          - unique
          - not_null
      - name: total_postings
        description: All postings from that company (summed from jobs_postings)
      - name: unique_job_title
        description: Unique job titles (summed from jobs_postings)
      - name: remote_posts
        description: Postings flagged remote at that company
      - name: pct_remote_posts
        description: Share of postings that are remote at that company      

